# Packaging for the refounded Foundry namespace.
#
# P0.3A added this ALONGSIDE the legacy tree. Nothing under experiments/, pipeline/
# or docs/ is moved, imported, or made to depend on this package, and no legacy
# dependency is migrated or pinned here (P0.3A constraint:
# `deps: do_not_migrate_or_pin_legacy_dependencies_yet`). The dependency list is
# therefore EMPTY ON PURPOSE and is not a claim that the system has no dependencies
# -- it is a claim about THIS package, which is stdlib-only and stays that way.
#
# PATH E MILESTONE 1 adds the first console script. The package is no longer
# zero-behavior: it now ships one read-only command. That is a metadata change and
# an entry point, not a dependency migration and not a legacy move.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtjawnny-foundry"
version = "0.1.0"
description = "MTG Thesaurus Foundry — permanent capabilities and the read-only runtime"
requires-python = ">=3.11"
dependencies = []

# The installed command. It is what makes INSTALLED_PACKAGE a context an operator
# can actually USE rather than only import: `mtj-foundry-report` is on PATH after
# an install, runs from any working directory, and needs no PYTHONPATH.
[project.scripts]
mtj-foundry-report = "mtj_foundry.cli:main"

# PATH E MILESTONE 2. One subcommand-style script for the whole evidence
# capability -- `index`, `query`, `evaluate` -- rather than three entry points
# for one thing. `mtj-foundry-report` is the accepted milestone-1 surface and is
# deliberately not folded into it.
mtj-foundry-evidence = "mtj_foundry.evidence_cli:main"

# PATH E MILESTONE 3. A SEPARATE script rather than a fourth `mtj-foundry-evidence`
# subcommand, and the reason is the accepted M2 contract's own sentence: that
# command "writes no file and creates no directory". A bundle builder writes several
# hundred files, so folding it in would falsify an accepted contract line and force
# an edit to accepted prose for tidiness -- exactly what `evidence_cli` declined to
# do to `mtj-foundry-report`. M2's surface is untouched.
mtj-foundry-pilot = "mtj_foundry.pilot_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

# Only the new namespace is discoverable. Legacy top-level directories are not
# packages and must not be swept in by discovery.
[tool.setuptools.packages.find]
where = ["src"]
include = ["mtj_foundry*"]

# The milestone-3 bundle template. PACKAGE-OWNED so an installed command can find
# it with no repository present, which is the same reason milestone 1 made the
# repository root an explicit parameter. These three files are inert markup, style
# and rendering code; they are not a dependency and they add none.
[tool.setuptools.package-data]
"mtj_foundry.pilot_assets" = ["index.html", "assets/*.css", "assets/*.js"]
