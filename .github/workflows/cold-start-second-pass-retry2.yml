name: Retry second cold-start archive pass index-aware

on:
  push:
    branches:
      - cleanup/cold-start-archive-2026-09-12

permissions:
  contents: write

jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute reviewed second-pass script with index-aware conservation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/cold-start-second-pass.yml').read_text().splitlines(True)
          start=src.index('      - name: Archive non-sole-home handoffs and repair stale phase pointers\n')
          run_i=next(i for i in range(start,len(src)) if src[i]=='        run: |\n')
          end=src.index('      - name: Commit and push second pass\n',run_i)
          body=[]
          for line in src[run_i+1:end]:
              if line.startswith('          '): line=line[10:]
              elif line.strip(): raise SystemExit(f'unexpected indentation: {line!r}')
              body.append(line)
          text=''.join(body)
          old="old='Current phase state is `refoundation/ACTIVE-PHASE.yaml`. '+tail\n    new='No repository phase file assigns work. '+tail"
          new="old='Current phase state is `refoundation/ACTIVE-PHASE.yaml`.'\n    new='No repository phase file assigns work.'"
          assert text.count(old)==1, text.count(old)
          text=text.replace(old,new,1)
          anchor='''# Registry topology must remain exact despite moves/banners.\npython3 "$TMP/registry_snapshot.py" "$TMP/after.json"'''
          replacement='''# Registry topology must remain exact despite moves/banners. The registry\n# enumerates Git's INDEX, so stage the replacement stubs before measuring.\ngit add docs archive/routing/docs\npython3 "$TMP/registry_snapshot.py" "$TMP/after.json"'''
          assert text.count(anchor)==1, text.count(anchor)
          text=text.replace(anchor,replacement,1)
          Path('/tmp/cold-start-second-pass.sh').write_text(text)
          PY
          bash /tmp/cold-start-second-pass.sh

      - name: Commit and push second pass
        run: |
          git config user.name "Cold-start cleanup"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs: archive remaining non-binding handoff routing"
          git push origin HEAD:cleanup/cold-start-archive-2026-09-12
