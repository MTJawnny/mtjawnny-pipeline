name: Apply cold-start archive cleanup

on:
  push:
    branches:
      - cleanup/cold-start-archive-2026-09-12

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply archive and routing cleanup
        shell: bash
        run: |
          set -euo pipefail
          BASE=9f92039eb9c7132a351576c31472eb30a2957a67
          BRANCH=cleanup/cold-start-archive-2026-09-12
          git merge-base --is-ancestor "$BASE" HEAD
          TMP="$RUNNER_TEMP/cold-start-apply"
          mkdir -p "$TMP" archive/routing/docs archive/routing/refoundation

          # Capture the accepted-head registry with the registry's actual parser.
          cat > "$TMP/registry_snapshot.py" <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('rr','tests/guards/gate2/foundry_ruling_registry.py')
          rr=importlib.util.module_from_spec(spec); spec.loader.exec_module(rr)
          Path(sys.argv[1]).write_text(json.dumps(rr.build(),indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          python3 "$TMP/registry_snapshot.py" "$TMP/before.json"

          docs_candidates=(
            docs/SESSION-HANDOFF-2026-08-06.md
            docs/SESSION-HANDOFF-2026-08-07.md
            docs/SESSION-HANDOFF-2026-08-09.md
            docs/NEXT-SESSION-CR-NORMALIZATION.md
            docs/SESSION-START-PROCEDURE.md
            docs/PICK-UP-HERE.md
            docs/CONSOLIDATION-2A-CLASSIFY-DIRECTIVE.md
            docs/CONSOLIDATION-2B-ENUMERATE-DIRECTIVE.md
            docs/CONSOLIDATION-RUN1-DIRECTIVE.md
            docs/DET-PATTERNS-RUN2-DIRECTIVE.md
          )

          # Move historical bodies byte-for-byte, then write inert compatibility stubs.
          for p in "${docs_candidates[@]}"; do
            git mv "$p" "archive/routing/docs/${p#docs/}"
          done
          python3 - "$TMP/before.json" "${docs_candidates[@]}" <<'PY'
          import json,pathlib,sys
          reg=json.load(open(sys.argv[1]))
          for ptxt in sys.argv[2:]:
              p=pathlib.Path(ptxt); name=p.name; archived=pathlib.Path('archive/routing/docs')/name
              lines=archived.read_text(encoding='utf-8').splitlines()
              hit_lines=sorted({x['line'] for occ in reg['rulings'].values() for x in occ if x['doc']==name})
              body=[
                '# ARCHIVED — DO NOT FOLLOW','',
                '**Current task authority is GitHub Issue #1: latest `K` -> active `T`.**','',
                f'Historical body: `archive/routing/docs/{name}` (preserved unchanged).','',
                'This old path remains only because current repository guards and historical links',
                'treat direct `docs/` paths as load-bearing. It assigns no task and contains no',
                'successor instructions.',
              ]
              if hit_lines:
                  body += ['', '## Registry-preserved historical ruling-reference lines','',
                           'The exact original source lines below are retained mechanically so the',
                           'ruling-registry topology does not fabricate a loss during archival.','']
                  body += [lines[n-1] for n in hit_lines]
              p.write_text('\n'.join(body)+'\n',encoding='utf-8')
          PY

          # Archive obsolete refoundation routing/state bodies.
          for p in refoundation/MANAGER-START.md refoundation/README.md refoundation/ROADMAP.md; do
            git mv "$p" "archive/routing/refoundation/${p#refoundation/}"
          done
          cp refoundation/ACTIVE-PHASE.yaml archive/routing/refoundation/ACTIVE-PHASE.yaml
          cp refoundation/BOOTSTRAP-STATE.yaml archive/routing/refoundation/BOOTSTRAP-STATE.yaml

          cat > refoundation/ACTIVE-PHASE.yaml <<'EOF'
          schema: mtj-archived-router/1
          status: ARCHIVED_DO_NOT_FOLLOW
          archive: archive/routing/refoundation/ACTIVE-PHASE.yaml
          task_authority: GitHub Issue #1 latest K -> active T
          note: >-
            This compatibility path is not current phase state and assigns no work.
            Resolve the latest valid K in Issue #1; do not infer a task from this file.
          EOF

          cat > refoundation/BOOTSTRAP-STATE.yaml <<'EOF'
          schema: mtj-archived-router/1
          status: ARCHIVED_DO_NOT_FOLLOW
          archive: archive/routing/refoundation/BOOTSTRAP-STATE.yaml
          task_authority: GitHub Issue #1 latest K -> active T
          note: >-
            This compatibility path is not current state and assigns no work.
            Bootstrap history is archived; task state lives only in Issue #1 checkpoints.
          EOF

          # Root generic cold-start router. It points to authority; it mirrors no current SHA/count.
          cat > README.md <<'EOF'
          # mtjawnny-pipeline

          Weekly GitHub Actions pipeline: fetches Scryfall bulk data, merges custom tags,
          and builds corpus artifacts for mtjawnny.com's tools. Card data is external to git.

          ## Cold start for any LLM

          **There is exactly one task-authority mechanism: GitHub Issue #1, latest valid `K` -> active `T`.**

          1. Read Issue #1 and resolve the latest valid `K` yourself.
          2. Read `h` from that checkpoint for the accepted implementation head and `a` for the active task pointer.
          3. If an active `T` exists, execute only that task and read only the subsystem authority/evidence it names.
          4. If no task is selected, do not infer one from a filename, date, mtime, branch age, handoff, roadmap, or archived prompt.

          Claude Code Workers also obey root `CLAUDE.md`, the role-specific operating contract.
          Other LLMs should use this router plus Issue #1 and the exact active task.

          `archive/` is inert history. Files there may explain prior work but never assign current work.
          EOF

          # Remove the stale phase import from the canonical Worker law without changing its project/semantic rules.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CLAUDE.md'); s=p.read_text()
          old='## Current phase\n\n@refoundation/ACTIVE-PHASE.yaml\n\n'
          assert old in s
          s=s.replace(old,'## Task routing\n\nTask state is not mirrored in a repository phase file. Resolve it from GitHub Issue #1: **latest `K` -> active `T`**.\n\n',1)
          old2='3. `refoundation/` current-state files (phase context, not task authority).'
          assert old2 in s
          s=s.replace(old2,'3. Task-specific subsystem authority/evidence explicitly named by the selected `T`.',1)
          p.write_text(s)
          PY

          # Keep the valid Worker pointer, remove only the obsolete phase-state hop.
          cat > refoundation/WORKER-START.md <<'EOF'
          # FRESH WORKER — START HERE

          This file is a pointer, not a manual. Nothing here is authority on its own.

          - **Root `CLAUDE.md` is the canonical Worker contract**, auto-loaded every session.
          - **Live task authority is GitHub Issue #1: latest `K` -> active `T`.** Nothing else assigns work.

          A fresh Worker inspects local state, resolves the latest valid `K`, verifies the selected task's exact base and scope, executes exactly that one task, posts its durable result to Issue #1, and follows `CLAUDE.md`'s human-return contract.

          Do not ask for a transcript or select work from a handoff, filename, date, mtime, roadmap, archived prompt, or branch chronology. A new session is normal; durable GitHub/repository state must be enough.
          EOF

          # Preserve the still-binding session protocol while deleting the obsolete current-phase state class/hop.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('refoundation/SESSION-PROTOCOL.md'); s=p.read_text()
          old='''- **STATE** — what is true right now: current phase, active task, controls,\n  authority pointers. Lives in `refoundation/ACTIVE-PHASE.yaml`. Replaced, never\n  appended.\n'''
          new='''- **STATE** — selected task and accepted implementation state. The selector lives\n  in GitHub Issue #1 checkpoints: **latest `K` -> active `T`**. Repository files\n  must not mirror a second present-tense task/phase selector.\n'''
          assert old in s; s=s.replace(old,new,1)
          old2='''1. Read `refoundation/ACTIVE-PHASE.yaml` for current phase.\n2. Read Issue #1: the latest `K`, its active `T`, and the `X` under review.\n3. Verify recorded refs against live GitHub state.\n4. Inspect only the repository evidence that result needs.\n5. Mutate nothing until current state is understood.\n6. Issue at most one next task unless Captain says otherwise.\n'''
          new2='''1. Read Issue #1: resolve the latest valid `K`, its active `T`, and any `X` under review.\n2. Verify recorded refs against live GitHub state.\n3. Inspect only the repository evidence that result needs.\n4. Mutate nothing until current state is understood.\n5. Issue at most one next task unless Captain says otherwise.\n'''
          assert old2 in s; s=s.replace(old2,new2,1)
          p.write_text(s)
          PY

          # Replace the guard's old five-document phase model with the new cold-start invariant.
          cat > tests/refoundation/test_worker_operating_contract.py <<'PY'
          """Guard the cold-start control plane against stale routing.

          Task selection has one owner: GitHub Issue #1 latest K -> active T.
          The root README is the generic LLM router; CLAUDE.md is the Claude Worker law;
          SESSION-PROTOCOL keeps durable Manager/Worker semantics; WORKER-START is only a
          compact role pointer. Historical phase/bootstrap paths are inert tombstones.
          """
          from __future__ import annotations
          import re
          import unittest
          from tests.refoundation.helpers import REPO_ROOT

          README = REPO_ROOT / 'README.md'
          CLAUDE = REPO_ROOT / 'CLAUDE.md'
          WORKER = REPO_ROOT / 'refoundation' / 'WORKER-START.md'
          PROTOCOL = REPO_ROOT / 'refoundation' / 'SESSION-PROTOCOL.md'
          ACTIVE_TOMBSTONE = REPO_ROOT / 'refoundation' / 'ACTIVE-PHASE.yaml'
          BOOTSTRAP_TOMBSTONE = REPO_ROOT / 'refoundation' / 'BOOTSTRAP-STATE.yaml'
          CURRENT_ROUTING = {
              'README.md': README,
              'CLAUDE.md': CLAUDE,
              'refoundation/WORKER-START.md': WORKER,
              'refoundation/SESSION-PROTOCOL.md': PROTOCOL,
          }
          ARCHIVED_ROUTING = (
              REPO_ROOT / 'archive/routing/refoundation/ACTIVE-PHASE.yaml',
              REPO_ROOT / 'archive/routing/refoundation/BOOTSTRAP-STATE.yaml',
              REPO_ROOT / 'archive/routing/refoundation/MANAGER-START.md',
              REPO_ROOT / 'archive/routing/refoundation/README.md',
              REPO_ROOT / 'archive/routing/refoundation/ROADMAP.md',
          )
          K_SELECTOR = 'latest K -> active T'
          PROTOCOL_FORM = 'M:T -> W:X -> M:V -> M:T|K'
          EXACT_HUMAN_CONTRACT = 'Claude done'
          IMPORT_RE = re.compile(r'@([A-Za-z0-9_.\-]+(?:/[A-Za-z0-9_.\-]+)+)')
          SHA40_RE = re.compile(r'\b[0-9a-f]{40}\b')
          PR_STATE_RE = re.compile(r'(?i)\b(?:PR|pull[\s_-]?request)[\s_-]*#?\s*\d+')
          STALE_SELECTOR_RE = re.compile(r'latest\s+accepted\s+K', re.I)
          HISTORICAL_ROUTING = (
              r'docs/SESSION-HANDOFF[A-Za-z0-9-]*\.md', r'docs/PICK-UP-HERE\.md',
              r'docs/SESSION-START-PROCEDURE\.md', r'docs/NEXT-SESSION-[A-Za-z0-9-]*\.md',
              r'refoundation/ACTIVE-PHASE\.yaml', r'refoundation/BOOTSTRAP-STATE\.yaml',
              r'refoundation/MANAGER-START\.md', r'refoundation/ROADMAP\.md',
              r'refoundation-manager-bootstrap-\d{4}-\d{2}-\d{2}',
          )
          EVERY_SESSION_INVARIANTS = (
              'PRESERVE TRUTH, NOT PLUMBING','Issue #1','self-authorized successor',
              'Never merge','STOP','transitive','Negative-control','No card data in git',
              'oracle_id','Halt loudly','Determinism','Captain','Manager','Worker',
          )
          AUTHORITY_LAW_PHRASES = ('evidence, not authority','never self-authorizes','STOP and report the conflict')
          RANK_RULE='Rank buries, never excludes'
          RANK_LAW='Rank buries, never excludes (sole exception: corroboration gate).'

          def flat(text: str) -> str:
              return re.sub(r'\s+',' ',text.replace('*','').replace('`',''))
          def selector_problems(text: str):
              f=flat(text); out=[]
              if K_SELECTOR not in f: out.append('missing canonical selector')
              if STALE_SELECTOR_RE.search(f): out.append('stale selector spelling')
              return out
          def historical_routing_problems(text: str):
              return [m.group(0) for p in HISTORICAL_ROUTING for m in re.finditer(p,text)]
          def startup_import_problems(text: str):
              imports=IMPORT_RE.findall(text)
              return [] if not imports else [f'startup imports are {imports}; expected none']
          def authority_problems(text: str):
              f=flat(text); return [p for p in AUTHORITY_LAW_PHRASES if p not in f]
          def rank_problems(text: str):
              f=flat(text)
              return [] if RANK_RULE not in f or RANK_LAW in f else ['rank exception lost']
          def protocol_problems(text: str):
              out=[]
              if PROTOCOL_FORM not in text: out.append('branching protocol missing')
              if re.search(r'M:V\s*->\s*M:K',text): out.append('mandatory K')
              return out
          def checkpoint_problems(text: str):
              f=flat(text); out=[]
              for phrase in ('K is a CHECKPOINT','accepted_head','active_task'):
                  if phrase not in f: out.append(f'missing {phrase}')
              if K_SELECTOR not in f: out.append('missing selector')
              if re.search(r'K\s*=\s*acceptance|K is the acceptance arm|records? acceptance \(K\)',f):
                  out.append('K equated with acceptance')
              return out
          def tombstone_problems(text: str, archive_path: str):
              out=[]
              for required in ('ARCHIVED_DO_NOT_FOLLOW', archive_path, 'GitHub Issue #1', 'latest K -> active T'):
                  if required not in flat(text): out.append(f'missing {required}')
              if re.search(r'(?mi)^\s*(?:next|phase|goal|current_strategy)\s*:',text): out.append('carries task/phase state')
              return out
          def generic_router_problems(text: str):
              out=selector_problems(text)+historical_routing_problems(text)
              if SHA40_RE.search(text): out.append('mirrors a SHA')
              if PR_STATE_RE.search(text): out.append('mirrors PR state')
              if 'archive/' not in text or 'inert history' not in text: out.append('archive boundary missing')
              return out

          class TestColdStartContract(unittest.TestCase):
              def setUp(self):
                  self.text={n:p.read_text(encoding='utf-8') for n,p in CURRENT_ROUTING.items()}
                  self.claude=self.text['CLAUDE.md']; self.protocol=self.text['refoundation/SESSION-PROTOCOL.md']
              def test_current_routing_files_exist_and_archived_bodies_are_retained(self):
                  for p in CURRENT_ROUTING.values(): self.assertTrue(p.is_file(),p)
                  for p in ARCHIVED_ROUTING: self.assertTrue(p.is_file(),p)
              def test_generic_root_router_points_only_to_durable_authority(self):
                  self.assertEqual(generic_router_problems(self.text['README.md']),[])
              def test_no_current_routing_document_routes_through_superseded_state(self):
                  for n,t in self.text.items():
                      with self.subTest(n=n): self.assertEqual(historical_routing_problems(t),[])
              def test_every_current_router_carries_the_one_selector(self):
                  for n,t in self.text.items():
                      with self.subTest(n=n): self.assertEqual(selector_problems(t),[])
              def test_root_contract_imports_no_repository_state_file(self):
                  self.assertEqual(startup_import_problems(self.claude),[])
              def test_exact_human_contract_and_every_session_rules_survive(self):
                  self.assertIn(EXACT_HUMAN_CONTRACT,self.claude)
                  for rule in EVERY_SESSION_INVARIANTS: self.assertIn(rule,self.claude,rule)
              def test_measurement_remains_evidence_not_authority(self):
                  self.assertEqual(authority_problems(self.claude),[])
              def test_rank_exception_survives_if_rank_rule_survives(self):
                  self.assertEqual(rank_problems(self.claude),[])
              def test_protocol_branching_and_checkpoint_semantics_survive(self):
                  self.assertEqual(protocol_problems(self.protocol),[])
                  self.assertEqual(checkpoint_problems(self.protocol),[])
                  self.assertEqual(checkpoint_problems(self.claude),[])
              def test_phase_and_bootstrap_paths_are_inert_tombstones(self):
                  self.assertEqual(tombstone_problems(ACTIVE_TOMBSTONE.read_text(), 'archive/routing/refoundation/ACTIVE-PHASE.yaml'),[])
                  self.assertEqual(tombstone_problems(BOOTSTRAP_TOMBSTONE.read_text(), 'archive/routing/refoundation/BOOTSTRAP-STATE.yaml'),[])
              def test_control_plane_is_compact(self):
                  self.assertLessEqual(len(self.claude.splitlines()),180)
                  self.assertLessEqual(len(self.claude.encode()),8000)
                  self.assertLessEqual(len(self.text['README.md'].splitlines()),40)
                  self.assertLessEqual(len(self.text['refoundation/WORKER-START.md'].splitlines()),25)
                  self.assertLessEqual(len(self.protocol.splitlines()),140)

          class TestColdStartNegativeControls(unittest.TestCase):
              def setUp(self):
                  self.claude=CLAUDE.read_text(); self.protocol=PROTOCOL.read_text(); self.readme=README.read_text()
              def test_NC1_dated_handoff_route_is_red(self):
                  self.assertTrue(historical_routing_problems(self.readme+'\nRead docs/SESSION-HANDOFF-2026-08-09.md'))
              def test_NC2_phase_import_is_red(self):
                  self.assertTrue(startup_import_problems(self.claude+'\n@refoundation/ACTIVE-PHASE.yaml'))
              def test_NC3_stale_selector_is_red(self):
                  rig=self.readme.replace('latest valid `K` -> active `T`','latest accepted `K` -> active `T`')
                  self.assertTrue(selector_problems(rig))
              def test_NC4_missing_selector_is_red(self):
                  rig=self.readme.replace('latest valid `K` -> active `T`','whichever task looks current')
                  self.assertTrue(selector_problems(rig))
              def test_NC5_K_as_acceptance_is_red(self):
                  self.assertTrue(checkpoint_problems(self.claude+'\nK = acceptance\n'))
              def test_NC6_mandatory_K_protocol_is_red(self):
                  rig=self.protocol.replace(PROTOCOL_FORM,'M:T -> W:X -> M:V -> M:K')
                  self.assertTrue(protocol_problems(rig))
              def test_NC7_dropping_authority_law_is_red(self):
                  rig=self.claude.replace('**A measurement is evidence, not authority, and it never self-authorizes.**','Believe the measurement.')
                  self.assertTrue(authority_problems(rig))
              def test_NC8_dropping_rank_exception_is_red(self):
                  rig=self.claude.replace('Rank buries, never excludes (sole exception:\n  corroboration gate).','Rank buries, never excludes.')
                  self.assertTrue(rank_problems(rig))
              def test_NC9_current_SHA_in_generic_router_is_red(self):
                  self.assertTrue(generic_router_problems(self.readme+'\naccepted: 9412e9e6236dd6509941b668f0951fdbfc213d29'))
              def test_NC10_reactivating_tombstone_is_red(self):
                  t=ACTIVE_TOMBSTONE.read_text()+'\nphase: DO_THIS_NEXT\n'
                  self.assertTrue(tombstone_problems(t,'archive/routing/refoundation/ACTIVE-PHASE.yaml'))

          if __name__=='__main__': unittest.main()
          PY

          # Provenance ledger, generated from accepted h object identities.
          python3 - "$BASE" "${docs_candidates[@]}" <<'PY'
          import pathlib,subprocess,sys
          base=sys.argv[1]; docs=sys.argv[2:]
          rows=[]
          def blob(p): return subprocess.check_output(['git','rev-parse',f'{base}:{p}'],text=True).strip()
          for p in docs:
              rows.append((p,f'archive/routing/docs/{pathlib.Path(p).name}',blob(p),'archived body + inert compatibility stub','GitHub Issue #1 latest K -> active T'))
          for p in ['refoundation/ACTIVE-PHASE.yaml','refoundation/BOOTSTRAP-STATE.yaml','refoundation/MANAGER-START.md','refoundation/README.md','refoundation/ROADMAP.md']:
              rows.append((p,f'archive/routing/refoundation/{pathlib.Path(p).name}',blob(p),'obsolete present-tense routing/state scaffolding','GitHub Issue #1 latest K -> active T'))
          L=['# Cold-start routing archive','',f'Source accepted implementation: `{base}`.','',
             'Everything below is history. **Do not follow archived NEXT/startup instructions.** Current task authority is GitHub Issue #1: latest `K` -> active `T`.','',
             '| former path | archive path | original blob | disposition | superseding authority |','|---|---|---|---|---|']
          for r in rows: L.append('| '+ ' | '.join(f'`{x}`' if i<3 else x for i,x in enumerate(r))+' |')
          L += ['', 'Direct `docs/` compatibility stubs remain only because the ruling-registry and historical links treat those paths as load-bearing. Their historical bodies are here byte-for-byte; the stubs assign no task.','',
                '`refoundation/ACTIVE-PHASE.yaml` and `refoundation/BOOTSTRAP-STATE.yaml` remain only as inert compatibility pointers to their archived historical bodies. They are not task or phase selectors.','']
          pathlib.Path('archive/routing/README.md').write_text('\n'.join(L))
          PY

          git add README.md CLAUDE.md docs refoundation archive tests/refoundation/test_worker_operating_contract.py

          # Byte identity: every archived body must be exactly the accepted-head blob.
          for p in "${docs_candidates[@]}"; do
            test "$(git rev-parse "$BASE:$p")" = "$(git hash-object "archive/routing/docs/${p#docs/}")"
          done
          for p in refoundation/ACTIVE-PHASE.yaml refoundation/BOOTSTRAP-STATE.yaml refoundation/MANAGER-START.md refoundation/README.md refoundation/ROADMAP.md; do
            test "$(git rev-parse "$BASE:$p")" = "$(git hash-object "archive/routing/refoundation/${p#refoundation/}")"
          done

          # Ruling topology must be exact; then run the standing ratchet itself.
          python3 "$TMP/registry_snapshot.py" "$TMP/after.json"
          python3 - "$TMP/before.json" "$TMP/after.json" <<'PY'
          import json,sys
          a,b=(json.load(open(x)) for x in sys.argv[1:])
          keys=['total_references','distinct_rulings','corroborated','sole_home']
          assert len(a['per_doc'])==len(b['per_doc'])==142
          assert all(a[k]==b[k] for k in keys),[(k,a[k],b[k]) for k in keys]
          def homes(r): return {rid:sorted({x['doc'] for x in occ}) for rid,occ in r['rulings'].items()}
          assert homes(a)==homes(b)
          print('registry topology conserved:', {k:b[k] for k in keys})
          PY
          python3 tests/guards/gate2/foundry_ruling_registry.py --check-only

          # Current routing guard must be green and negative-controlled.
          python3 -m unittest tests.refoundation.test_worker_operating_contract

          git diff --cached --check
          git status --short

      - name: Commit and push cleanup
        run: |
          git config user.name "Cold-start cleanup"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs: archive stale cold-start routing and collapse authority path"
          git push origin HEAD:cleanup/cold-start-archive-2026-09-12
