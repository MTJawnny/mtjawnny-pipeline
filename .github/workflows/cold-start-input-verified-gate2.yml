name: Export exact source trees for Gate 2

on:
  push:
    branches:
      - cleanup/cold-start-archive-2026-09-12

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      ACCEPTED_H: 9f92039eb9c7132a351576c31472eb30a2957a67
      CLEANUP_H: 18a4260d7d5b72e6b13a36fec335d82287f24792
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export exact tracked trees
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/source-export"
          mkdir -p "$OUT/accepted" "$OUT/cleanup"
          git archive "$ACCEPTED_H" | tar -x -C "$OUT/accepted"
          git archive "$CLEANUP_H" | tar -x -C "$OUT/cleanup"
          test "$(git rev-parse "$ACCEPTED_H")" = "$ACCEPTED_H"
          test "$(git rev-parse "$CLEANUP_H")" = "$CLEANUP_H"
          printf '%s\n' "$ACCEPTED_H" > "$OUT/accepted-head.txt"
          printf '%s\n' "$CLEANUP_H" > "$OUT/cleanup-head.txt"
          find "$OUT/accepted" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/accepted-tree-sha256.txt"
          find "$OUT/cleanup" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/cleanup-tree-sha256.txt"

      - name: Upload exact source export
        uses: actions/upload-artifact@v4
        with:
          name: exact-gate2-source-trees
          path: ${{ runner.temp }}/source-export/
          retention-days: 7
