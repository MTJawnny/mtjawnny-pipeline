name: Objective 1 foundry_common census

on:
  push:
    branches:
      - evidence/objective1-foundry-common-census-2026-09-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch and preserve census tool
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detach onto exact accepted implementation head
        run: |
          cp tools/objective1_foundry_common_census.py /tmp/objective1_foundry_common_census.py
          git checkout --detach 9f92039eb9c7132a351576c31472eb30a2957a67
          mkdir -p objective1-evidence
          git rev-parse HEAD | tee objective1-evidence/measured-head.txt
          git status --porcelain=v1 | tee objective1-evidence/pre-status.txt

      - name: Run tracked-file census at accepted head
        run: |
          python3 /tmp/objective1_foundry_common_census.py \
            --json objective1-evidence/foundry-common-census.json \
            --csv objective1-evidence/importer-symbol-matrix.csv \
            | tee objective1-evidence/census-stdout.txt

      - name: Run canonical Gate 2 without hiding result
        shell: bash
        run: |
          set +e
          python3 tests/guards/gate2/foundry_gate2.py > objective1-evidence/gate2-output.txt 2>&1
          rc=$?
          printf '%s\n' "$rc" > objective1-evidence/gate2-exit-code.txt
          cat objective1-evidence/gate2-output.txt
          echo "Gate 2 exit: $rc"
          exit 0

      - name: Record post-run tracked status
        run: |
          git status --porcelain=v1 | tee objective1-evidence/post-status.txt
          git diff -- . ':(exclude)objective1-evidence/**' > objective1-evidence/tracked-diff-after.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: objective1-foundry-common-census-accepted-head
          path: objective1-evidence/
          retention-days: 7
