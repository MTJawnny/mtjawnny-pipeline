name: Publish Objective 1 machine evidence

on:
  push:
    branches:
      - architecture/objective1-foundry-common-preflight-complete-2026-09-12

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact accepted-head census artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/obj1
          mkdir -p /tmp/obj1
          gh run download 34731174299 \
            --repo "$GITHUB_REPOSITORY" \
            --name objective1-foundry-common-census-accepted-head \
            --dir /tmp/obj1
          test "$(cat /tmp/obj1/measured-head.txt)" = "9f92039eb9c7132a351576c31472eb30a2957a67"

      - name: Materialize durable evidence package
        run: |
          mkdir -p docs/architecture/preflight/objective1
          cp /tmp/obj1/foundry-common-census.json docs/architecture/preflight/objective1/S10-FOUNDRY-COMMON-CENSUS.json
          cp /tmp/obj1/importer-symbol-matrix.csv docs/architecture/preflight/objective1/S10-FOUNDRY-COMMON-IMPORTER-SYMBOL-MATRIX.csv
          cp /tmp/obj1/gate2-output.txt docs/architecture/preflight/objective1/S10-FOUNDRY-COMMON-GATE2-CLEAN-RUNNER.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          base=Path('docs/architecture/preflight/objective1')
          d=json.loads((base/'S10-FOUNDRY-COMMON-CENSUS.json').read_text())
          assert d['accepted_head_measured']=='9f92039eb9c7132a351576c31472eb30a2957a67'
          assert d['counts']['foundry_common_importers_all']==87
          assert d['counts']['externally_referenced_surface_names_all']==35
          assert d['counts']['module_level_names_defined']==45

          # Exact tracked textual-reference register, separately tagged by archive/scope.
          tr={
            'schema':'mtj-foundry-common-textual-reference-map/1',
            'accepted_head':d['accepted_head_measured'],
            'entries':d['textual_references'],
          }
          (base/'S10-FOUNDRY-COMMON-TEXTUAL-REFERENCES.json').write_text(json.dumps(tr,indent=2)+'\n')

          groups={}
          def g(names,state,owner,rel,resp,proof,neg):
            for n in names: groups[n]=(state,owner,rel,resp,proof,neg)

          g(['_BOOTSTRAP_ROOT','_BOOTSTRAP_SRC','_PATHS'],
            'LEGACY_COMPOSITION_BOUNDARY','ProjectPaths + legacy loose-script bootstrap','legacy-only composition',
            'import-time root/src/legacy-sibling compatibility bootstrap',
            'exact root/path values, installed-package and intended loose-script import behavior',
            'corrupt root or reorder/remove sys.path insertion; import/path guard must fail')
          g(['REPO_ROOT','FOUNDRY_OUT_DIR','REVIEW_DIR','DATA_ARTIFACTS_DIR','CONFIG_SELECTORS','CONFIG_SEMANTIC','CONFIG_GENERATED','CONFIG_REGISTERS','CONFIG_CR','CONFIG_THESAURUS'],
            'DELETE_AFTER_CALLER_MIGRATION','mtj_foundry.paths.ProjectPaths','compatibility wrapper',
            'legacy aliases of permanent layout-owner values',
            'exact Path-value parity at explicit roots','perturb one path segment; parity guard must fail')
          g(['halt'],'LEGACY_COMPOSITION_BOUNDARY','none; process exit remains caller/composition concern','legacy-only composition',
            'STOP stderr + process exit adapter','exact stderr and exit=1 parity at legacy operator boundary','return/raise/change STOP line; boundary guard must fail')
          g(['is_prefilter_pattern','is_lattice_pattern','pattern_slug','_SELF_REF_FORMS','pattern_misses_cardname_token'],
            'LEGACY_COMPOSITION_BOUNDARY','legacy DET pattern-policy boundary','legacy-only composition',
            'DET pattern-role/slug/self-reference-token policy','exact tracked-pattern truth/list/order parity','flip known role/slug/token case; DET/sweep guard must fail')
          g(['batch_paths'],'LEGACY_COMPOSITION_BOUNDARY','no permanent batch-file naming owner selected','legacy-only composition',
            'legacy per-batch artifact naming','exact dict keys and path values for batch 1 and representative N','change suffix/review convention; path fixture must fail')
          g(['load_corpus'],'LEGACY_COMPOSITION_BOUNDARY','mtj_foundry.corpus.load_cards + build_name_index plus legacy halt adapter','compatibility wrapper',
            'raw corpus load/index/error adaptation','full-input cards/index equality and error text/exit parity','corrupt duplicate handling/index order/error adaptation; differential must fail')
          g(['gate_passes'],'DELETE_AFTER_CALLER_MIGRATION','mtj_foundry.corpus.is_gate0_eligible','behaviorally equivalent duplicate',
            'Gate #0 predicate','full-pop Gate0 differential on selected corpus','alter allowed values/null behavior; Gate0 differential must fail')
          g(['load_corpus_gated','resolve_name'],'LEGACY_COMPOSITION_BOUNDARY','permanent corpus primitives plus legacy composition policy','legacy-only composition',
            'gated population/index/count or exact-name ambiguity policy','full-pop population/index/count/resolution and failure parity','pre-filter index/fuzzy fallback/count corruption must fail')
          g(['_extract_faces'],'LEGACY_COMPOSITION_BOUNDARY','mtj_foundry.corpus.card_faces overlaps but review projection differs','differential duplicate',
            'review-specific face projection including loyalty','exact review schema fixtures across layouts','blindly replace with card_faces; loyalty/shape fixture must fail')
          g(['full_oracle_text'],'PERMANENT_OWNER_NEEDS_LIFT','mtj_foundry.corpus','legacy-only composition',
            'all-face Oracle text newline join','full selected-corpus exact string/order/empty-text parity','read only root text/change join/order; all-face differential must fail')
          g(['raw_faces'],'DELETE_AFTER_CALLER_MIGRATION','mtj_foundry.corpus.card_faces','exact delegation',
            'temporary face-projection facade','full-corpus value equality; Objective3 measured 32,557/32,557 equal','replace delegation with drifting copy; differential must fail')
          g(['CARDNAME_TOKEN','_cardname_candidates','_is_legendary','canonicalize_self_reference'],
            'PERMANENT_OWNER_NEEDS_LIFT','mtj_foundry.oracle_text DET-compatible self-reference contract, distinct from N2','divergent duplicate',
            'DET self-reference token/candidate/canonicalization policy','exact DET output; Objective3 measured neutral-vs-DET 1,818 divergences','substitute N2/remove legendary or shortened-name behavior; DET differential must fail')
          g(['_MODAL_HEADER_RE','is_mode_line'],
            'PERMANENT_OWNER_NEEDS_LIFT','mtj_foundry.oracle_text neutral structural recognition','unresolved',
            'modal header/option recognition','certified structural parity plus delivery/locality conservation','drop pawprint/Spree/header variant or admit Siege false-positive; guard must fail')
          g(['_DIE_ROW_RE','_ROLL_INSTRUCTION_RE','_is_die_row'],
            'PERMANENT_OWNER_NEEDS_LIFT','mtj_foundry.oracle_text neutral structural recognition','unresolved',
            'roll instruction/result-row recognition','CR706 row-form parity while delivery retains grouping semantics','drop row form or admit ownerless Station row; guard must fail')
          g(['_LEVEL_BAND_RE','_CLASS_LEVEL_RE','_is_band_marker'],
            'PERMANENT_OWNER_NEEDS_LIFT','mtj_foundry.oracle_text neutral marker recognition; delivery retains grouping','unresolved',
            'live Level/Class marker recognition','current liveness plus marker parity','drop marker/broaden boundary to roll-modal header; visibility guard must fail')
          g(['expand_modal_bullets','det_scan_texts'],
            'LEGACY_COMPOSITION_BOUNDARY','legacy DET preprocessing policy; no permanent DET module selected','legacy-only composition',
            'DET-specific synthetic scan representation','exact list length/order/string parity over selected corpus','delete/reorder variant/change space join/substitute N2; DET differential must fail')
          g(['build_review_card_record'],'LEGACY_COMPOSITION_BOUNDARY','review/pipeline composition','legacy-only composition',
            'review JSON record schema','exact key/value/default/nested-face fixtures','drop loyalty/faces/default/key; schema fixture must fail')
          g(['_CONDENSE_EFFECT_RE','condense_definition_for_prompt'],'LEGACY_COMPOSITION_BOUNDARY','SYNTH/prompt composition','legacy-only composition',
            'prompt-only definition condensation','exact structured/unstructured/truncation fixtures','change EFFECT or truncation boundary; prompt fixture must fail')
          g(['write_json'],'DELETE_AFTER_CALLER_MIGRATION','mtj_foundry.infra.artifact.write_json','exact delegation',
            'temporary artifact-byte facade','byte-exact UTF-8/indent/non-ASCII/one-LF/parent creation parity','change LF/encoding/indent or bypass owner; byte guard must fail')

          names={s['symbol'] for s in d['symbols']}
          assert names==set(groups), (names-set(groups), set(groups)-names)
          imps=d['importers']
          out=[]
          for s in d['symbols']:
            n=s['symbol']; state,owner,rel,resp,proof,neg=groups[n]
            callers=s['direct_or_dynamic_callers']
            classes=sorted({imps[p]['caller_class'] for p in callers})
            scopes=sorted({imps[p]['scope'] for p in callers})
            if n=='halt':
              rw={'reads':'message','writes':'stderr','exits_exceptions':'sys.exit(1)','import_time':'function definition only','filesystem_path_effects':'none'}
            elif n in {'load_corpus','load_corpus_gated'}:
              rw={'reads':'selected corpus path/content via corpus owner','writes':'none','exits_exceptions':'legacy halt on CorpusLoadError','import_time':'function definition only','filesystem_path_effects':'reads gzip corpus on call'}
            elif n=='write_json':
              rw={'reads':'path,data','writes':'delegated JSON file + parent dirs','exits_exceptions':'propagates serialization/filesystem errors','import_time':'function definition only','filesystem_path_effects':'write delegated to artifact owner'}
            elif n.startswith('_BOOTSTRAP') or n=='_PATHS':
              rw={'reads':'__file__/derived root' if n=='_BOOTSTRAP_ROOT' else 'bootstrap predecessor','writes':'sys.path indirectly for bootstrap path names' if n!='_PATHS' else 'none','exits_exceptions':'ordinary path/import errors','import_time':'active import-time bootstrap','filesystem_path_effects':'Path.resolve/sys.path/import resolution'}
            elif s['kind']=='constant_or_global':
              rw={'reads':'module initialization dependencies','writes':'none','exits_exceptions':'none','import_time':'bound at module import','filesystem_path_effects':'path value only where applicable'}
            else:
              rw={'reads':'function arguments and named module helpers','writes':'none unless caller performs returned-path I/O','exits_exceptions':'propagates ordinary argument/helper errors unless separately noted','import_time':'function definition only','filesystem_path_effects':'none unless separately noted'}
            out.append({
              'symbol':n,'kind':s['kind'],'defining_location':f"experiments/foundry_common.py:{s['line']}-{s['end_line']}",
              'exact_callers_importers':callers,'caller_classes':classes,'caller_scopes':scopes,
              'external_live':s['external_live'],'private_name':s['private_name'],
              **rw,'responsibility':resp,'permanent_equivalent_or_owner':owner,'behavioral_relationship':rel,
              'ownership_classification':state,'conservation_proof':proof,'required_negative_control':neg,
              'unresolved_question':('If total foundry_common deletion is required, name/authorize a permanent DET-policy owner first.' if n in {'expand_modal_bullets','det_scan_texts'} else None),
            })
          result={
            'schema':'mtj-objective1-foundry-common-symbol-map/1','status':'COMPLETE_PREFLIGHT_EVIDENCE_NOT_IMPLEMENTATION',
            'accepted_head':d['accepted_head_measured'],'provider_blob':'21192e3e6b8a1693abfe6a3b993e1014a2d84894',
            'relationship_vocabulary':['exact delegation','compatibility wrapper','behaviorally equivalent duplicate','differential duplicate','divergent duplicate','legacy-only composition','unresolved'],
            'planning_state_vocabulary':['PERMANENT_OWNER_EXISTS','PERMANENT_OWNER_NEEDS_LIFT','LEGACY_COMPOSITION_BOUNDARY','DELETE_AFTER_CALLER_MIGRATION','BLOCKED_ARCHITECTURE_DECISION_REQUIRED'],
            'symbols':out,
          }
          (base/'S10-FOUNDRY-COMMON-SYMBOL-MAP.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Commit exact evidence only
        run: |
          git config user.name "Objective 1 evidence bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/architecture/preflight/objective1/
          git diff --cached --check
          git commit -m "preflight: publish Objective 1 machine-readable census"
          git push origin HEAD:architecture/objective1-foundry-common-preflight-complete-2026-09-12
