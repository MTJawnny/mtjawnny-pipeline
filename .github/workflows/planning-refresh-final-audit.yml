name: Temporary planning refresh final audit

on:
  push:
    branches:
      - planning/s10-s16-refresh-2026-09-13

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify routing, registry, syntax and topology
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 -m unittest \
            tests.refoundation.test_worker_operating_contract \
            tests.refoundation.test_residual_routing_closeout
          python3 tests/guards/gate2/foundry_ruling_registry.py --check-only
          python3 tests/guards/gate2/foundry_ruling_registry.py --selftest
          python3 -m py_compile tests/guards/gate2/foundry_family_sweep.py
          python3 tests/guards/gate2/foundry_family_sweep.py --selftest
          git diff --check 493483aa1d54210c35e1665686a5e0136588da6d...HEAD -- \
            config/registers/family-sweep-known-debt.json \
            tests/guards/gate2/foundry_family_sweep.py \
            docs/architecture/S10-S16-CURRENT-PLAN-2026-09-13.md \
            docs/architecture/S10-WORKER-CONTRACT-REFRESH-2026-09-13.md \
            docs/architecture/preflight/S10-FOUNDRY-COMMON-CENSUS-REFRESH-2026-09-13.md
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          tracked=[p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          stale=[
            'docs/architecture/PREFLIGHT-PICK-UP-HERE.md',
            'docs/architecture/PREFLIGHT-OBJECTIVES-1-5-2026-09-11.md',
            'docs/architecture/OBJECTIVE-3-FRESH-CHATGPT-PREFLIGHT-PROMPT.md',
          ]
          assert not any(p in tracked for p in stale), [p for p in stale if p in tracked]
          workflows=[p for p in tracked if p.startswith('.github/workflows/')]
          print('WORKFLOWS_DURING_AUDIT='+json.dumps(workflows))
          assert '.github/workflows/build.yml' in workflows
          assert '.github/workflows/planning-refresh-final-audit.yml' in workflows
          w6=json.loads(Path('config/registers/family-sweep-known-debt.json').read_text())
          fp=[(x['kind'],x['subject']) for x in w6['blockers']]
          assert len(fp)==6 and len(set(fp))==6
          assert w6['how_it_is_enforced']['tool']=='python3 tests/guards/gate2/foundry_family_sweep.py --gate'
          assert w6['authority'].startswith('archive/routing/docs/WORK-PACKETS-2026-08-07.md section W6')
          text=Path('tests/guards/gate2/foundry_family_sweep.py').read_text()
          assert '"generated_by": "tests/guards/gate2/foundry_family_sweep.py"' in text
          assert 'Run:  python3 tests/guards/gate2/foundry_family_sweep.py' in text
          assert 'docs/grammars.json' not in text
          assert 'docs/det-patterns-v2.json' not in text
          print('W6_AND_FAMILY_SWEEP_PATH_REPAIR=PASS')
          PY
