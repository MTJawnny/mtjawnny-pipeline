name: Temporary S10 census and stale-reference audit

on:
  push:
    branches:
      - planning/s10-s16-refresh-2026-09-13

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-census foundry_common live importers
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, json, subprocess
          from pathlib import Path
          root=Path.cwd()
          tracked=[p for p in subprocess.check_output(["git","ls-files","-z"]).decode().split("\0") if p]
          py=[p for p in tracked if p.endswith(".py")]
          def refs(path):
              text=(root/path).read_text(encoding="utf-8")
              tree=ast.parse(text, filename=path)
              aliases=set(); names=set(); hit=False
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      for a in node.names:
                          if a.name in {"foundry_common","experiments.foundry_common"}:
                              hit=True; aliases.add(a.asname or a.name.rsplit(".",1)[-1])
                  elif isinstance(node,ast.ImportFrom) and node.module in {"foundry_common","experiments.foundry_common"}:
                      hit=True; names.update(a.name for a in node.names)
              if aliases:
                  for node in ast.walk(tree):
                      if isinstance(node,ast.Attribute) and isinstance(node.value,ast.Name) and node.value.id in aliases:
                          names.add(node.attr)
                      elif isinstance(node,ast.Call) and isinstance(node.func,ast.Name) and node.func.id=="getattr" and len(node.args)>=2 and isinstance(node.args[0],ast.Name) and node.args[0].id in aliases and isinstance(node.args[1],ast.Constant) and isinstance(node.args[1].value,str):
                          names.add(node.args[1].value)
              return hit,sorted(names)
          errors=[]; live={}; archived={}
          for p in py:
              try: hit,names=refs(p)
              except Exception as e: errors.append([p,repr(e)]); continue
              if hit: (archived if p.startswith("archive/") else live)[p]=names
          report={"head":subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip(),"tracked_files":len(tracked),"tracked_python":len(py),"live_python":sum(not p.startswith("archive/") for p in py),"archived_python":sum(p.startswith("archive/") for p in py),"parse_errors":errors,"live_foundry_common_importers":len(live),"archived_foundry_common_importers":len(archived),"all_foundry_common_importers":len(live)+len(archived),"live_importers":live,"archived_importers":archived,"live_referenced_names":sorted({n for ns in live.values() for n in ns})}
          print("S10_CENSUS_REFRESH_JSON="+json.dumps(report,sort_keys=True,separators=(",",":")))
          assert not errors
          assert "experiments/foundry_build_reaudit_packet.py" not in live
          assert "archive/routing/experiments/foundry_build_reaudit_packet.py" in archived
          PY
      - name: Sweep stale live references
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path.cwd()
          tracked=[p for p in subprocess.check_output(["git","ls-files","-z"]).decode().split("\0") if p]
          needles=[
            "docs/WORK-PACKETS-2026-08-07.md",
            "docs/T3-BUILDOUT-PLAYBOOK.md",
            "docs/T3-AXIS-FOUNDRY-v3.md",
            "experiments/foundry_family_sweep.py",
            "docs/AQ4-SEMANTIC-ARCHITECTURE-IMPLEMENTATION-CONTRACT.md",
            "PREFLIGHT-PICK-UP-HERE.md",
            "PREFLIGHT-OBJECTIVES-1-5-2026-09-11.md",
            "OBJECTIVE-3-FRESH-CHATGPT-PREFLIGHT-PROMPT.md",
          ]
          hits={n:[] for n in needles}
          for p in tracked:
              if p.startswith("archive/") or p.startswith("docs/architecture/preflight/") or p==".github/workflows/s10-census-refresh-audit.yml":
                  continue
              try: text=(root/p).read_text(encoding="utf-8")
              except Exception: continue
              for n in needles:
                  if n in text:
                      lines=[i+1 for i,s in enumerate(text.splitlines()) if n in s]
                      hits[n].append([p,lines])
          print("STALE_LIVE_REFERENCE_SWEEP_JSON="+json.dumps(hits,sort_keys=True,separators=(",",":")))
          PY
