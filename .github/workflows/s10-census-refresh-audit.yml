name: Temporary family-sweep moved-path repair

on:
  push:
    branches:
      - planning/s10-s16-refresh-2026-09-13

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'cleanup: repair family-sweep moved-path metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair only stale moved-path metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/guards/gate2/foundry_family_sweep.py')
          s=p.read_text(encoding='utf-8')
          reps={
            'docs/grammars.json': 'config/semantic/grammars.json',
            'docs/det-patterns-v2.json': 'config/semantic/det-patterns-v2.json',
            'python3 experiments/foundry_family_sweep.py': 'python3 tests/guards/gate2/foundry_family_sweep.py',
            '"generated_by": "experiments/foundry_family_sweep.py"': '"generated_by": "tests/guards/gate2/foundry_family_sweep.py"',
          }
          counts={}
          for old,new in reps.items():
              counts[old]=s.count(old)
              if counts[old] < 1:
                  raise SystemExit(f'missing expected stale string: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          print('replacement_counts',counts)
          PY
          git diff --check
          git diff -- tests/guards/gate2/foundry_family_sweep.py
          git config user.name MTJawnny
          git config user.email mtjawnny@gmail.com
          git add tests/guards/gate2/foundry_family_sweep.py
          git commit -m 'cleanup: repair family-sweep moved-path metadata'
          git push origin HEAD:planning/s10-s16-refresh-2026-09-13
