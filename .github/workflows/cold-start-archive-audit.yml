name: Cold-start archive candidate audit

on:
  push:
    branches:
      - cleanup/cold-start-archive-2026-09-12

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detach exact accepted implementation head
        run: |
          git checkout --detach 9f92039eb9c7132a351576c31472eb30a2957a67
          test "$(git rev-parse HEAD)" = "9f92039eb9c7132a351576c31472eb30a2957a67"

      - name: Audit candidates and simulate archive sets
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cold-start-audit"
          mkdir -p "$OUT"

          docs_candidates=(
            docs/SESSION-HANDOFF-2026-08-06.md
            docs/SESSION-HANDOFF-2026-08-07.md
            docs/SESSION-HANDOFF-2026-08-09.md
            docs/NEXT-SESSION-CR-NORMALIZATION.md
            docs/SESSION-START-PROCEDURE.md
            docs/PICK-UP-HERE.md
            docs/CONSOLIDATION-2A-CLASSIFY-DIRECTIVE.md
            docs/CONSOLIDATION-2B-ENUMERATE-DIRECTIVE.md
            docs/CONSOLIDATION-RUN1-DIRECTIVE.md
            docs/DET-PATTERNS-RUN2-DIRECTIVE.md
          )
          ref_candidates=(
            refoundation/ACTIVE-PHASE.yaml
            refoundation/BOOTSTRAP-STATE.yaml
            refoundation/MANAGER-START.md
            refoundation/README.md
            refoundation/ROADMAP.md
            refoundation/SESSION-PROTOCOL.md
            refoundation/WORKER-START.md
          )

          printf 'accepted_head=%s\n' "$(git rev-parse HEAD)" > "$OUT/identity.txt"
          printf 'main=%s\n' "$(git rev-parse origin/main)" >> "$OUT/identity.txt"

          : > "$OUT/path-consumers.txt"
          for p in "${docs_candidates[@]}" "${ref_candidates[@]}"; do
            echo "===== $p =====" >> "$OUT/path-consumers.txt"
            git grep -n -F "$p" -- ':!archive/**' ':!docs/archive/**' 2>/dev/null >> "$OUT/path-consumers.txt" || true
          done

          # Build the registry topology using the registry's own tracked_docs() and
          # harvest_file()/build() functions, but do not invoke main/ratchet/output.
          cat > "$RUNNER_TEMP/registry_snapshot.py" <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('rr','tests/guards/gate2/foundry_ruling_registry.py')
          rr=importlib.util.module_from_spec(spec); spec.loader.exec_module(rr)
          reg=rr.build()
          out=Path(sys.argv[1])
          out.write_text(json.dumps(reg,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY

          snapshot () {
            python3 "$RUNNER_TEMP/registry_snapshot.py" "$OUT/$1-registry.json"
          }
          snapshot baseline

          python3 - "$OUT/baseline-registry.json" "$OUT/candidate-ruling-status.json" "${docs_candidates[@]}" <<'PY'
          import json,sys,pathlib
          reg=json.load(open(sys.argv[1])); dst=sys.argv[2]; paths=sys.argv[3:]
          out={}
          for p in paths:
              name=pathlib.Path(p).name
              d=reg['per_doc'][name]
              out[p]={
                'ruling_ids':d['ruling_ids'],
                'sole_home_for':d['sole_home_for'],
                'deletion_blocked':d['deletion_blocked'],
                'deletable_on_registry_test_alone':not d['deletion_blocked'],
              }
          json.dump(out,open(dst,'w'),indent=2,sort_keys=True); open(dst,'a').write('\n')
          PY

          simulate_set () {
            label="$1"; shift
            git reset --hard 9f92039eb9c7132a351576c31472eb30a2957a67 >/dev/null
            mkdir -p archive/routing/docs
            for p in "$@"; do
              git mv "$p" "archive/routing/docs/${p#docs/}"
            done
            snapshot "$label"
            git diff --cached --name-status > "$OUT/$label-moves.txt"
          }

          simulate_set zero_ruling_set \
            docs/SESSION-HANDOFF-2026-08-06.md \
            docs/SESSION-HANDOFF-2026-08-07.md \
            docs/SESSION-HANDOFF-2026-08-09.md \
            docs/NEXT-SESSION-CR-NORMALIZATION.md

          simulate_set startup_routers \
            docs/SESSION-START-PROCEDURE.md \
            docs/PICK-UP-HERE.md

          simulate_set old_directives \
            docs/CONSOLIDATION-2A-CLASSIFY-DIRECTIVE.md \
            docs/CONSOLIDATION-2B-ENUMERATE-DIRECTIVE.md \
            docs/CONSOLIDATION-RUN1-DIRECTIVE.md \
            docs/DET-PATTERNS-RUN2-DIRECTIVE.md

          simulate_set all_docs_candidates "${docs_candidates[@]}"

          python3 - "$OUT" <<'PY'
          import json,pathlib,sys
          out=pathlib.Path(sys.argv[1])
          labels=['baseline','zero_ruling_set','startup_routers','old_directives','all_docs_candidates']
          regs={k:json.loads((out/f'{k}-registry.json').read_text()) for k in labels}
          base=regs['baseline']
          def homes(reg):
              return {rid:sorted({x['doc'] for x in occ}) for rid,occ in reg['rulings'].items()}
          bh=homes(base)
          report={
            'baseline':{k:base[k] for k in ['generated_from','total_references','distinct_rulings','corroborated','sole_home']}
          }
          for label in labels[1:]:
              r=regs[label]; h=homes(r)
              all_ids=sorted(set(bh)|set(h))
              changed={rid:{'before':bh.get(rid,[]),'after':h.get(rid,[])} for rid in all_ids if bh.get(rid,[])!=h.get(rid,[])}
              report[label]={
                'metrics':{k:r[k] for k in ['generated_from','total_references','distinct_rulings','corroborated','sole_home']},
                'lost_ruling_ids':sorted(set(bh)-set(h)),
                'new_ruling_ids':sorted(set(h)-set(bh)),
                'changed_home_count':len(changed),
                'changed_homes':changed,
                'sole_home_documents':{n:d['sole_home_for'] for n,d in r['per_doc'].items() if d['sole_home_for']},
              }
          (out/'registry-comparison.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

          git reset --hard 9f92039eb9c7132a351576c31472eb30a2957a67 >/dev/null

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-archive-candidate-audit
          path: ${{ runner.temp }}/cold-start-audit/
          retention-days: 7
