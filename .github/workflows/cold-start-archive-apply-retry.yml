name: Retry cold-start archive cleanup

on:
  push:
    branches:
      - cleanup/cold-start-archive-2026-09-12

permissions:
  contents: write

jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract reviewed application script and canonicalize selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/cold-start-archive-apply.yml').read_text().splitlines(True)
          start=src.index('      - name: Apply archive and routing cleanup\n')
          run_i=next(i for i in range(start,len(src)) if src[i]=='        run: |\n')
          end=src.index('      - name: Commit and push cleanup\n',run_i)
          body=[]
          for line in src[run_i+1:end]:
              if line.startswith('          '): line=line[10:]
              elif line.strip(): raise SystemExit(f'unexpected indentation: {line!r}')
              body.append(line)
          text=''.join(body)
          old='latest valid `K` -> active `T`'
          assert text.count(old)==3, text.count(old)
          text=text.replace(old,'latest `K` -> active `T`')
          Path('/tmp/cold-start-apply.sh').write_text(text)
          PY
          bash /tmp/cold-start-apply.sh

      - name: Commit and push cleanup
        run: |
          git config user.name "Cold-start cleanup"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs: archive stale cold-start routing and collapse authority path"
          git push origin HEAD:cleanup/cold-start-archive-2026-09-12
