name: Final cold-start hazard audit

on:
  push:
    branches:
      - cleanup/cold-start-archive-2026-09-12

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sweep routing hazards
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/final-cold-start-audit"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/head.txt"
          git rev-parse origin/main > "$OUT/default-main.txt"
          git diff --name-status 9f92039eb9c7132a351576c31472eb30a2957a67...HEAD > "$OUT/diff-name-status.txt"

          python3 - "$OUT" <<'PY'
          import importlib.util,json,pathlib,re,subprocess,sys
          out=pathlib.Path(sys.argv[1]); root=pathlib.Path('.')
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          tracked=[p for p in tracked if p and not p.startswith('archive/')]
          text_ext={'.md','.txt','.yaml','.yml','.json','.py','.toml','.sh'}
          terms=[
            'PICK-UP-HERE','NEXT','ACTIVE','fresh Claude','fresh ChatGPT','resume',
            'Worker executes','STOP','Objective 1','Objective 2','Objective 3',
            'Objective 4','Objective 5','AQ4','Bridge v0','STEP6','MIGRATION_FIRST',
            'S10','S11','S12','S13','S14','S15','S16',
            '9f92039eb9c7132a351576c31472eb30a2957a67',
            '36655d59860d812bdbd8f352ad9d7176604c7797',
            'b360bced4ccd2ce250d283d665b4df08b30256c2',
          ]
          matches=[]
          for p in tracked:
              q=root/p
              if not q.is_file() or q.suffix.lower() not in text_ext: continue
              try: text=q.read_text(encoding='utf-8')
              except Exception: continue
              for term in terms:
                  for i,line in enumerate(text.splitlines(),1):
                      if term.casefold() in line.casefold():
                          matches.append({'path':p,'line':i,'term':term,'text':line[:500]})
          (out/'term-matches.json').write_text(json.dumps(matches,indent=2,ensure_ascii=False)+'\n')

          # Load ruling registry through its own parser/build path, not output artifacts.
          spec=importlib.util.spec_from_file_location('rr','tests/guards/gate2/foundry_ruling_registry.py')
          rr=importlib.util.module_from_spec(spec); spec.loader.exec_module(rr)
          reg=rr.build()
          session=[]
          routing_name=re.compile(r'(SESSION-HANDOFF|HANDOFF|PICK-UP|NEXT-SESSION|START|ROADMAP|ACTIVE|PROMPT|RESUME)',re.I)
          for p in tracked:
              q=root/p
              if not q.is_file(): continue
              name=q.name
              if routing_name.search(name) or p in {'README.md','CLAUDE.md','refoundation/SESSION-PROTOCOL.md','refoundation/WORKER-START.md'}:
                  try: text=q.read_text(encoding='utf-8')
                  except Exception: continue
                  d=reg.get('per_doc',{}).get(name) if p.startswith('docs/') and q.suffix=='.md' else None
                  session.append({
                    'path':p,
                    'first_25_lines':'\n'.join(text.splitlines()[:25]),
                    'archived_stub':text.startswith('# ARCHIVED — DO NOT FOLLOW'),
                    'sole_home_for':(d or {}).get('sole_home_for',[]),
                    'ruling_ids':(d or {}).get('ruling_ids',[]),
                    'deletion_blocked':(d or {}).get('deletion_blocked'),
                  })
          (out/'routing-like-files.json').write_text(json.dumps(session,indent=2,ensure_ascii=False)+'\n')

          # Current references to archived payloads: expected only from explicit inert pointers,
          # provenance ledgers, or tests that guard those pointers.
          refs=[]
          for p in tracked:
              q=root/p
              if not q.is_file() or q.suffix.lower() not in text_ext: continue
              try: lines=q.read_text(encoding='utf-8').splitlines()
              except Exception: continue
              for i,line in enumerate(lines,1):
                  if 'archive/routing/' in line:
                      refs.append({'path':p,'line':i,'text':line[:500]})
          (out/'archive-path-references.json').write_text(json.dumps(refs,indent=2,ensure_ascii=False)+'\n')

          # Flag Path-E/refoundation prose that still makes present-tense phase/router claims.
          phase=[]
          for p in tracked:
              if not p.startswith('refoundation/'): continue
              q=root/p
              if not q.is_file() or q.suffix.lower() not in {'.md','.yaml','.yml'}: continue
              text=q.read_text(encoding='utf-8')
              for i,line in enumerate(text.splitlines(),1):
                  low=line.casefold()
                  if ('current phase' in low or 'active-phase.yaml' in low or 'read first' in low or 'next work' in low or 'current state' in low) and 'archived' not in low:
                      phase.append({'path':p,'line':i,'text':line[:500]})
          (out/'refoundation-present-tense.json').write_text(json.dumps(phase,indent=2,ensure_ascii=False)+'\n')
          PY

          python3 tests/guards/gate2/foundry_ruling_registry.py --check-only | tee "$OUT/ruling-registry-check.txt"
          python3 -m unittest tests.refoundation.test_worker_operating_contract 2>&1 | tee "$OUT/routing-guard.txt"
          git diff --check 9f92039eb9c7132a351576c31472eb30a2957a67...HEAD | tee "$OUT/diff-check.txt"

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: final-cold-start-hazard-audit
          path: ${{ runner.temp }}/final-cold-start-audit/
          retention-days: 7
