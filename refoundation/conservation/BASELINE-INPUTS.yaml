# 5. NOT INVENTORIED AND NOT CLASSIFIED. The boundary is stated explicitly rather
#    than left silent, but it is a MEASUREMENT boundary, not a disposition.
#
#    P0.3A's first draft called this whole tree EPHEMERAL_OUTPUT under C4. That was
#    WRONG, and the Manager review (R1_OUTPUT_CLASS) is correct to refuse it: a
#    TRACKED governance record already depends on ignored bytes in here as EVIDENCE.
#    docs/INCIDENT-AQ4-PHASE-A-ADJUDICATOR-A-STOP-BREACH-2026-08-17.md names three
#    experiments/out/aq4/ artifacts, one of them pinned by sha256 and asserted to
#    still reproduce byte-identically. Captain direction requires preserving the
#    incident/governance records needed to understand accepted state, so a blanket
#    "generated, therefore not a conservation input" class is unsupported by the
#    evidence and would license exactly the deletion it cannot justify.
#
#    The class below is therefore deliberately NON-DISPOSITIVE. It records what was
#    measured and refuses to infer anything from it. Per P0.3A.R1 (output_census:
#    DEFER) no census and no hashing of this tree was performed here - including of
#    the aq4 counter-example, which is NAMED as the reason a census is needed and is
#    not itself censused.
not_inventoried:
  - path_glob: experiments/out/**
    file_count: 3321
    total_bytes: 2892506087
    artifact_class: MIXED_UNCLASSIFIED_PENDING_CENSUS
    hashed: false
    census_performed: false
    disposition_inferred: NONE
    may_be_relied_on_for_deletion: false
    may_be_relied_on_for_conservation: false
    reason: >-
      Measured only. This tree demonstrably holds at least three distinct material
      classes - ephemeral batch/report output, acceptance-governing control input,
      and evidence a tracked governance record depends on - so no single class
      describes it. Classification requires a bounded exception census, which is
      deferred.
    # EXACT PATHS, not a glob with a count. A glob plus file_count is a cardinality
    # claim about a subtree - "this subtree contains 3 files" - and no census was run,
    # so that claim was not measured. What IS known is narrower and is all that is
    # recorded: these three specific paths are named by a tracked governance record.
    # Whether the aq4 subtree holds only these three is unknown and unclaimed here.
    known_counter_examples_to_a_blanket_ephemeral_class:
      source: docs/INCIDENT-AQ4-PHASE-A-ADJUDICATOR-A-STOP-BREACH-2026-08-17.md
      source_is_tracked: true
      claim: >-
        These exact paths are named as evidence by the tracked incident record above.
        They are gitignored, and the incident calls the Adjudicator-A overlay
        non-authoritative - but non-authoritative is not disposable, and AQ4 is PAUSED
        at this incident boundary. Their existence is sufficient to refute a blanket
        ephemeral class over experiments/out/**; it is not a census of it.
      subtree_cardinality_claimed: false
      hashed: false
      censused: false
      paths:
        - experiments/out/aq4/triage-deterministic-census.json
        - experiments/out/aq4/unit-binding-adjudication-s0-a.json
        - experiments/out/aq4/unit-binding-workqueue.json
      note: >-
        unit-binding-workqueue.json is pinned by sha256 inside the incident record
        itself. That hash is the incident's, quoted by reference only - P0.3A did not
        recompute it, because doing so would be the deferred census.
    exceptions_captured_above:
      - experiments/out/foundry/audit-baseline.json
      - experiments/out/foundry/codebook.json
    required_before_any_disposition:
      - a bounded exception census naming every acceptance- or evidence-bearing path
      - Manager/Captain review of that census
      - no deletion, move, or conservation claim over this tree until both are done

