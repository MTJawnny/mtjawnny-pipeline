# acceptance, authority, benchmark, incident or governance weight.
#
# WHAT THIS IS. P0.3A recorded experiments/out/** as
# MIXED_UNCLASSIFIED_PENDING_CENSUS: measured, never dispositioned. This census is
# the bounded exception pass that state requires. It does NOT classify the tree, and
# it does not authorize deleting anything.
#
# WHAT IT IS NOT. It is NOT exhaustive over the 3,321 files in that tree. It is a
# census of what TRACKED SOURCE REFERENCES, and its completeness is exactly the
# completeness of that reference scan - no more. A file nothing tracked mentions is
# absent from this document, and absence here is NOT evidence of disposability.
#
# EVERY candidate below carries provenance to a tracked source. Nothing was included
# because it looked important, and no role was assigned by inspecting file contents.

