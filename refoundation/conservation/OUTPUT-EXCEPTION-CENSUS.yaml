  tracked_files_scanned: 356
  read_only: true
  mutations_to_output_tree: NONE
  discovery:
    - id: literal_reference
      description: >-
        Every tracked file scanned line by line for the token experiments/out/ followed
        by path characters. Records source path, line number and the surrounding line.
    - id: constructed_reference
      description: >-
        Tracked Python scanned for output paths BUILT rather than written literally, and
        the construction resolved statically to a concrete path. This arm is not
        optional: experiments/foundry_audit_baseline.py line 35 builds the ratchet path
        as Path(__file__).resolve().parent / 'out' / 'foundry' / 'audit-baseline.json',
        so a literal grep does not find the single most acceptance-bearing file in the
        tree. 44 tracked files construct paths through foundry_common.FOUNDRY_OUT_DIR.
    - id: task_must_include
      description: five paths named by the P0.3B task contract, recorded as such.
  role_derivation:
    principle: >-
      A role is derived from the CONSUMER, never from the file's name, location or
      contents. Content was never opened except to hash it.
    multi_role: >-
      A path may hold SEVERAL roles and all are recorded. Returning only the first
      would have hidden that unit-binding-workqueue.json is both incident evidence and
      the AQ4 benchmark's queue - whichever rule ran first would have claimed it
      silently and the other consumer would have vanished from this census.
  not_performed:
    whole_tree_enumeration: false
    whole_tree_hash: false
    disposition_assignment: false
    semantic_inference: false
    aq4_execution: false
    gate2_run: false
    content_inspection_beyond_hashing: false

