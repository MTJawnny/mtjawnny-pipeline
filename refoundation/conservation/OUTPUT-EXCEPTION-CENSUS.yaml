conclusions:
  deletion_authorized: false
  whole_tree_classified: false
  manager_review_required: true
  candidate_list_exhaustive: false
  dispositions_assigned: NONE
  findings:
    - >-
      A LITERAL GREP WOULD HAVE MISSED THE MOST ACCEPTANCE-BEARING FILE IN THE TREE.
      experiments/foundry_audit_baseline.py builds its path from __file__ rather than
      writing it, so audit-baseline.json - the ratchet that decides whether a standing
      audit degraded - appears in no literal reference from its own writer. The
      constructed-reference arm exists because of this, and 44 tracked files build
      output paths the same way.
    - >-
      THE LOCAL CODEBOOK MIRROR MATCHES THE SELECTED AUTHORITY EXACTLY. Measured
      sha256 and byte size both equal docs/codebook-authority.json's selection. This
      re-derives P0.3A's finding independently rather than citing it, and no codebook
      bytes were copied into git.
    - >-
      ONE PATH CARRIES TWO ROLES. unit-binding-workqueue.json is named as evidence by
      the tracked incident AND is the AQ4 benchmark's queue. A single-role classifier
      would have recorded one and silently dropped the other.
    - >-
      31 EXACT CANDIDATES HAVE NO CODE CONSUMER AT ALL - they are referenced only in
      tracked prose. They are UNKNOWN_REVIEW, not derivable: a tracked prose reference
      does not create authority, and equally does not establish that a file can be
      regenerated. This is the largest group needing a human decision.
    - >-
      11 REFERENCED PATHS DO NOT EXIST ON THIS MACHINE. Recorded as references without
      artifacts. This is a fact about this working copy, not a property of the paths.
    - >-
      THE CENSUS HAS A DECLARED BLIND SPOT. Nine dynamic constructions cannot be
      resolved statically, and files nothing tracked mentions are invisible to a
      reference scan by construction.
  what_this_does_not_establish:
    - a DERIVABLE_OUTPUT_CANDIDATE role is a HYPOTHESIS from the consumer set, not a finding that the file is reproducible
    - no file here is shown to be safely deletable, and none is proposed for deletion
    - non_authoritative != disposable; the AQ4 overlay is non-authoritative and is still evidence
    - a tracked prose reference does not create authority
    - this document's own status field cannot ratify anything
  required_before_any_disposition:
    - Manager review of these candidates and their roles
    - resolution of the nine dynamic constructions, or an explicit decision to accept them unresolved
    - a decision on whether coverage limited to tracked references is sufficient, or whether the tree needs enumerating
    - for any DERIVABLE_OUTPUT_CANDIDATE proposed for deletion, an actual reproduction test
