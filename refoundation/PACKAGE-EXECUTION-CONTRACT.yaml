schema: mtj-package-execution-contract/1
id: PACKAGE-EXECUTION-CONTRACT
status: ACTIVE
established_by: C8.5E.PACKAGE-IMPORT-EXECUTION-CONTRACT
authority:
  task: issue:1#issuecomment-5471902653
  study: issue:1#issuecomment-5471856911
  captain_direction: issue:1#issuecomment-5471882570
  self_authority: false

purpose: >-
  Declare, in one machine-readable place, the execution contexts in which
  `mtj_foundry` may be relied upon to import, and the exact prerequisite for
  deleting each temporary bootstrap that stands in for a real installation
  today. Establishing this contract deletes no bootstrap and moves no module; it
  is what makes new permanent code able to rely on the package at all.

# ---------------------------------------------------------------------------
# CONTEXTS
# ---------------------------------------------------------------------------
contexts:

  - id: INSTALLED_PACKAGE
    status: SUPPORTED_PERMANENT
    definition: >-
      `import mtj_foundry` succeeds from an unrelated working directory with no
      PYTHONPATH set, because the package has been installed into the
      interpreter that is running. Since Path E milestone 1 the context also
      carries a COMMAND: the declared console script is on PATH after an install
      and runs with no repository on the path and no PYTHONPATH set.
    this_is_the_target: true
    provisioning: 'pip install -e . (from the repository root), or pip install <repository>'
    provisioning_requires:
      - 'setuptools>=68, per [build-system] requires in pyproject.toml'
      - >-
        that build dependency must be obtainable — from an index (network) or an
        environment where it is already present. MEASURED 2026-08-30: this
        machine has no setuptools in the system interpreter and `python -m venv`
        on Python 3.14 does not seed one, so the provisioning STEP is not
        reproducible offline here.
    evidence_boundary:
      # Two different things, kept apart on purpose. C8.5E's first attempt blurred
      # them and the Manager stopped it (issue:1#issuecomment-5472076171).

      - class: REAL_INSTALL_PROVISIONING
        what: 'an actual pip install, running the declared build backend'
        status: OBSERVED
        evidence_kind: WORKER_LOCAL
        is_it_what_the_committed_test_does: NO
        note: >-
          No committed test runs pip, executes a build backend, or produces a
          distribution. Nothing here should be read as claiming otherwise.
        observations:
          # Each entry is a dated Worker-local observation, kept as HISTORY. A
          # later observation does not rewrite an earlier one; the environment
          # fact each recorded was true when it was measured.
          - when: C8.5D
            where: 'a scratch copy outside the repository, when setuptools was obtainable'
            what_ran: 'pip install -e .'
            what_it_proved: 'the metadata installs'
          - when: PATH_E_M1
            where: 'a fresh venv built from the system interpreter, outside the repository'
            what_ran: >-
              python -m venv, then `pip install <repository>` against the
              candidate checkout, with setuptools resolved from an index
            what_it_proved: >-
              the declared console script `mtj-foundry-report` is installed onto
              the environment's PATH, imports the package from site-packages
              rather than from the repository source tree, and runs to a
              successful report from a working directory unrelated to the
              repository with the environment emptied of PYTHONPATH.
            why_it_is_not_a_committed_test: >-
              it needs an index to obtain the build dependency. The committed
              suite may not require network, and a test that failed for an
              environment reason would say nothing about the contract.

      - class: METADATA_DRIVEN_EDITABLE_IMPORT_PROOF
        what: >-
          The committed offline guard. It copies THIS pyproject.toml and src/
          into a scratch directory outside the repository, parses the scratch
          metadata with stdlib `tomllib`, derives from `package-dir` and
          `packages.find` (where / include / exclude) both whether `mtj_foundry`
          is discoverable and which directory an editable install would map, and
          provisions the throwaway interpreter from THAT derived scratch
          location. It then imports from an unrelated cwd with no PYTHONPATH.
        status: COMMITTED_AND_ENFORCED
        evidence_kind: 'runs in tests/refoundation on every suite run'
        what_it_guards: >-
          The installed-import CONDITION, coupled to the metadata that would
          produce it. Corrupting `package-dir`, `packages.find.where` or
          `include` in the scratch copy turns the SAME import witness red, and a
          committed control proves each of those three.
        what_it_is_NOT: >-
          It is not a claim that pip ran, and it is not EXPLICIT_SOURCE_LAYOUT
          wearing a different hat: it never names the repository source tree, and
          a guard asserts the derived location is not the repository's `src`.
        why_it_is_built_this_way: >-
          `pip install -e .` cannot run offline in this environment at all, and
          the committed suite may not require network. A test that shelled out to
          pip would fail for an environment reason and say nothing about the
          contract.

  - id: LEGACY_LOOSE_SCRIPT_BOOTSTRAP
    status: SUPPORTED_TRANSITIONAL
    definition: >-
      A legacy module is run or imported as a loose script with no installed
      package present, and reaches what it needs through the compatibility
      bootstraps enumerated below.
    supported_until: >-
      the deletion prerequisite of each bootstrap family is satisfied. Until
      then this context is load-bearing and no bootstrap may be removed.
    it_is_not_the_target: true

  - id: EXPLICIT_SOURCE_LAYOUT
    status: DEVELOPMENT_DIAGNOSTIC_ONLY
    definition: 'PYTHONPATH=src, or any equivalent manual placement of the source tree on the path.'
    rule: >-
      This is a developer/diagnostic convenience and MUST NOT be confused with
      the permanent install contract. Code may never assume it, a test may never
      substitute it for INSTALLED_PACKAGE, and no acceptance claim may rest on
      it. The refoundation test suite itself reaches the package this way
      (tests/refoundation/helpers.py), which is precisely why the distinction is
      written down: the suite passing does NOT demonstrate the install contract.

# ---------------------------------------------------------------------------
# BOOTSTRAP FAMILIES
#
# Enumerated from source at C8.5C head aa003340 by resolving the argument of
# every real `sys.path` call in legacy production to repository-relative
# components. All calls resolve; there is no unresolved remainder. A committed
# guard re-derives this table and fails if source and contract disagree in
# either direction.
#
# The measured total was 89 at C8.5C and is 82 after S9 -- ten bootstraps left
# legacy production with the guards that owned them, and four were added for the
# test-owned probe. The COUNT is not the contract; the families are, and a
# fourth one now exists.
# ---------------------------------------------------------------------------
bootstrap_families:

  - id: PACKAGE_LOCATION
    adds: src
    sites: 1
    site_list:
      - experiments/foundry_common.py:34
    introduced_by: C8.5A
    what_it_is_for: >-
      Locating `src/mtj_foundry` so the compatibility boundary can import the
      permanent path owner. Nothing can ask the layout owner where it lives
      before importing it, so this literal is irreducible while the package is
      not installed.
    deletion_prerequisite: >-
      The INSTALLED_PACKAGE context holds in every environment in which legacy
      code is invoked. Nothing else. This is the ONLY family the install
      contract unblocks.

  - id: LEGACY_SIBLING_IMPORT
    adds: experiments
    # S4: 87 -> 86 within legacy production. The site did NOT disappear -- the
    # ground-truth guard moved to `tests/guards/gate2/test_ground_truth.py`, so
    # its one bootstrap left the measured scope with it. It is still an
    # import-only LEGACY_SIBLING_IMPORT and still D6/S15 cleanup debt; the
    # deletion prerequisite below is unchanged and now covers it at its new
    # location too.
    #
    # S9: 86 -> 76, the same shape ten more times. Eleven Gate-2 guard scripts
    # and the probe library moved to `tests/guards/{gate2,probe}/`; ten of the
    # twelve carried a bootstrap out of the measured scope with them. Two did
    # not: the Gate-2 runner never had one, and `foundry_ruling_registry.py` had
    # relied on being run FROM the legacy directory, so it GAINED an explicit
    # member of this same family at its new address -- still import-only, still
    # this family's debt, still outside the measured scope. NOTHING WAS DELETED.
    sites: 76
    migrated_out_of_scope_was: experiments/foundry_ground_truth.py
    migrated_out_of_scope_now: tests/guards/gate2/test_ground_truth.py
    migrated_out_of_scope_still: IMPORT_ONLY_TRANSITIONAL_D6_S15_DEBT
    s9_migrated_out_of_scope: tests/guards/gate2/, tests/guards/probe/
    site_list: DERIVED_FROM_SOURCE
    introduced_by: PRE_REFOUNDATION
    what_it_is_for: >-
      Putting the legacy module directory on the path so `import
      foundry_common`, `import tier_engine` and their siblings resolve when a
      module is run as a loose script. Spelled two ways that resolve to the same
      directory: a repository-relative join, and the module re-adding its own
      directory.
    deletion_prerequisite: >-
      The legacy modules become importable without their directory being placed
      on the path by hand — i.e. the legacy tree becomes a real package, or the
      scripts are invoked as modules. This is NOT unblocked by installing
      `mtj_foundry` and is a materially larger change.

  - id: TEST_OWNED_PROBE_IMPORT
    adds: tests/guards/probe
    # S9. The FOURTH family, and it is declared rather than folded into
    # LEGACY_SIBLING_IMPORT because it adds a DIFFERENT directory -- a contract
    # that merged them would describe a family that does not exist and hide one
    # that does.
    sites: 4
    site_list: DERIVED_FROM_SOURCE
    introduced_by: S9
    what_it_is_for: >-
      `foundry_probe` became test-owned at `tests/guards/probe/foundry_probe.py`
      in migration slice 9. The four ACTIVE legacy consumers that import it by
      bare name — the idiom CLAUDE.md records — put its new directory on the
      path so that import keeps resolving. Import-only, exactly like
      LEGACY_SIBLING_IMPORT, and it carries no other module.
    deletion_prerequisite: >-
      The probe is consumed as a real importable module rather than by bare
      name — i.e. the guard tree becomes a package, or its consumers are
      invoked as modules. This is NOT unblocked by installing `mtj_foundry`:
      the probe is a TEST-owned library and is deliberately not part of the
      shipped package.

  - id: LEGACY_ROOT_DOTTED_IMPORT
    adds: ''
    sites: 1
    site_list:
      - experiments/snapshot.py:111
    introduced_by: PRE_REFOUNDATION
    what_it_is_for: >-
      Putting the REPOSITORY ROOT on the path, inside a function, so that
      `import experiments.tier_engine` — a package-style dotted import of a
      legacy module — resolves. It is the only site that adds the root itself,
      and the only bootstrap that is deferred rather than module-level.
    deletion_prerequisite: >-
      As LEGACY_SIBLING_IMPORT, and stricter: the dotted form additionally
      requires `experiments` to be an importable package, or the call site must
      stop using the dotted spelling.

# ---------------------------------------------------------------------------
# NON-CLAIMS — what installing this package does NOT mean
# ---------------------------------------------------------------------------
non_claims:

  - id: NOT_A_DEPENDENCY_MIGRATION
    statement: >-
      `dependencies = []` is true of THIS PACKAGE and stays true. It is not a
      claim about the repository. `pipeline/` requires eight third-party
      packages (requests, pyyaml, Pillow, sentence-transformers, torch, numpy,
      pandas, pyarrow per requirements.txt). Legacy foundry production under
      `experiments/` is stdlib-only, measured. No runtime dependency is
      migrated, pinned or vendored by this contract.

  - id: NOT_AUTHORIZATION_TO_MOVE_A_SUBSYSTEM
    statement: >-
      An importable package is enabling infrastructure for BOTH MOVE_ADAPT and
      CLEAN_REIMPLEMENT_FROM_CONTRACT. It commits the project to neither, and it
      is not permission to migrate, copy or reimplement any legacy module. Per
      the Captain's ratified direction, legacy code is evidence and a behavior
      oracle, not the target architecture; the next reconstruction decision is a
      per-subsystem DISPOSITION REVIEW, not an automatic module move.

  - id: NOT_A_BOOTSTRAP_DELETION
    statement: >-
      Every bootstrap enumerated above is still load-bearing at this head and
      none is removed by this contract. Deletion is gated per family on the
      prerequisite recorded with it, and on the gates being green at that time.

  - id: INSTALL_ARTIFACTS_ARE_NOT_SOURCE
    statement: >-
      Anything an installation produces — egg-info, build/, dist/, path
      configuration files, virtual environments — is a generated artifact. It is
      never source, never authority, and never an input to a decision.
      `.gitignore` already covers `*.egg-info/` and `.venv/`; an install
      performed in the repository therefore produces untracked, ignored bytes,
      and any conservation manifest that includes ignored paths must declare
      that delta in advance rather than discover it.

# ---------------------------------------------------------------------------
# WHAT THIS CONTRACT CHANGED
# ---------------------------------------------------------------------------
transition:
  # PATH E M1. The two fields that moved are named; every other one is unchanged
  # and is repeated here rather than dropped, because a removed line reads as a
  # fact nobody measured.
  layout_census_movement: ZERO
  bootstraps_deleted: 0
  legacy_modules_moved: 0
  legacy_modules_reimplemented: 0
  production_python_changed: 0
  pyproject_changed: true
  pyproject_change_is: >-
    one [project.scripts] console-script entry point, an accurate description,
    and a version. `dependencies = []` is UNCHANGED and still true of the code:
    the runtime and its CLI are stdlib-only, and a committed guard asserts it
    over their import statements rather than over the metadata alone.
  new_capability: INSTALLED_READ_ONLY_RUNTIME_COMMAND
  debt_removed: 0
  debt_made_explicitly_removable: true
