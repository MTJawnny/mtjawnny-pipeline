schema: mtj-active-phase/1

# CURRENT REPLACEABLE STATE. Not chronology, not task authority.
# Replace fields when the phase changes; never append history.
# Per-task authority is GitHub Issue #1: latest K -> active T.

phase: PATH_E_M2_FULL_POPULATION_EVIDENCE_INDEX_RETRIEVAL

goal: >-
  Reach a useful Foundry by the shortest honest route: a reproducible installed
  read-only runtime, then a full-population evidence index, then a static pilot.

current_strategy: >-
  Build the permanent operational path first. Freeze speculative migration
  infrastructure and historical consumers unless the selected product path
  actually needs them.

principle: PRESERVE_TRUTH_NOT_PLUMBING

ctl: {AQ4: P, BRIDGE0: U, STEP6: N, MERGE: N}
# P=paused  U=unused  N=not started / no

permanent_namespace: mtj_foundry
layout_owner: mtj_foundry.paths.ProjectPaths

task_authority: GitHub Issue #1 latest K -> active T
phase_update_rule: replace fields; never append history

# A slice is safe to reason about only at this unit. A green library test is not
# evidence about the shipped command; a synthetic fixture is not evidence about
# the selected bytes.
safe_reasoning_unit: installed_artifact_boundary
required_axes:
  - input_identity
  - provenance
  - installation
  - composition
  - failure_observability
  - population_accounting
  - determinism
  - conservation
  - evidence_polarity
  - measurement_honesty
